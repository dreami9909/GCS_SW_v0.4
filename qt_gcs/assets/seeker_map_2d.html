<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <style>
    html, body, #map, #offline { width:100%; height:100%; margin:0; overflow:hidden; background:#11150f; }
    body { font-family:"IBM Plex Mono",Consolas,monospace; color:#d9e3d8; }
    #offline {
      display:none; position:absolute; inset:0;
      background:
        linear-gradient(rgba(112,101,65,.20),rgba(112,101,65,.20)),
        repeating-linear-gradient(22deg,#665b3e 0,#665b3e 18px,#756746 19px,#756746 37px);
    }
    #offline::before {
      content:""; position:absolute; inset:0; opacity:.28;
      background-image:linear-gradient(#d6d0a31f 1px,transparent 1px),linear-gradient(90deg,#d6d0a31f 1px,transparent 1px);
      background-size:32px 32px;
    }
    #targetOffline { position:absolute; left:50%; top:50%; }
    .target-wrap {
      position:absolute; width:64px; height:48px;
      transform:translate(-32px,-24px); pointer-events:none;
      will-change:left,top;
    }
    .target-block {
      position:absolute; left:32px; top:24px;
      width:var(--target-width,11.7px); height:var(--target-height,7.15px);
      box-sizing:border-box; background:#020202; border:1px solid rgba(235,235,220,.86);
      box-shadow:0 1px 3px rgba(0,0,0,.95);
      transform:translate(-50%,-50%);
      transition:width 90ms linear,height 90ms linear;
      will-change:width,height;
    }
    .track-box {
      display:none; position:absolute; left:32px; top:24px;
      width:var(--box-width,42px); height:var(--box-height,30px);
      box-sizing:border-box; transform:translate(-50%,-50%);
      border:2px solid #ffd34f;
      transition:width 90ms linear,height 90ms linear;
      will-change:width,height;
    }
    .target-wrap.midcourse .track-box {
      display:block; border:3px solid #ffd34f;
      box-shadow:0 0 9px rgba(255,211,79,.78);
    }
    .target-wrap.terminal .track-box {
      display:block; border:3px solid #ff554c;
      box-shadow:0 0 12px rgba(255,60,50,.88);
    }
    .target-wrap.destroyed .track-box {
      display:block; border:3px solid #ff554c;
    }
    .track-label {
      display:none; position:absolute; left:4px; top:-10px; padding:1px 4px;
      color:#111; background:#ffd34f; font-size:9px; font-weight:800; white-space:nowrap;
    }
    .target-wrap.midcourse .track-label,.target-wrap.terminal .track-label,.target-wrap.destroyed .track-label { display:block; }
    .target-wrap.terminal .track-label,.target-wrap.destroyed .track-label { background:#ff554c; color:#fff; }
    .target-wrap.destroyed .track-label { display:none; }
    .shutdown-cross,.shutdown-caption { display:none; position:absolute; z-index:8; }
    .shutdown-cross {
      left:32px; top:24px; transform:translate(-50%,-50%);
      color:#ff4038; font:900 min(24vw,132px)/.8 Arial,sans-serif;
      text-shadow:0 3px 4px #000,0 0 12px rgba(255,30,20,.75);
    }
    .shutdown-caption {
      left:32px; top:76px; transform:translateX(-50%);
      padding:4px 10px; color:#fff; background:rgba(86,5,4,.92);
      border:2px solid #ff4038; font:900 14px "IBM Plex Mono",Consolas,monospace;
      letter-spacing:1px; white-space:nowrap; box-shadow:0 2px 5px #000;
    }
    .target-wrap.destroyed .shutdown-cross,
    .target-wrap.destroyed .shutdown-caption { display:block; }
    #hud { position:absolute; inset:0; z-index:10; pointer-events:none; text-shadow:0 1px 2px #000; }
    #crosshair::before,#crosshair::after { content:""; position:absolute; background:rgba(205,239,205,.70); }
    #crosshair::before { left:50%; top:calc(50% - 13px); width:1px; height:26px; }
    #crosshair::after { left:calc(50% - 13px); top:50%; width:26px; height:1px; }
    #topLeft,#topRight,#bottomLeft,#bottomRight {
      position:absolute; padding:4px 6px; background:rgba(2,7,4,.62); font-size:9px; letter-spacing:.25px;
    }
    #topLeft { left:5px; top:5px; }
    #topRight { right:5px; top:5px; text-align:right; }
    #bottomLeft { left:5px; bottom:5px; }
    #bottomRight { right:5px; bottom:5px; text-align:right; }
    #scanlines { position:absolute; inset:0; opacity:.09; background:repeating-linear-gradient(0deg,transparent,transparent 3px,#baffc2 4px); }
  </style>
</head>
<body>
  <div id="map"></div>
  <div id="offline"><div id="targetOffline" class="target-wrap"><div class="track-label"></div><div class="track-box"></div><div class="target-block"></div><div class="shutdown-cross">✕</div><div class="shutdown-caption">SHUT DOWN</div></div></div>
  <div id="hud">
    <div id="crosshair"></div><div id="scanlines"></div>
    <div id="topLeft">NO LOCK</div><div id="topRight">ATR SEARCH</div>
    <div id="bottomLeft">GOOGLE SATELLITE / NOMINAL EO</div><div id="bottomRight">COVER 1.20 KM</div>
  </div>
  <script>
    const API_KEY = __API_KEY_JSON__;
    let map = null;
    let targetOverlay = null;
    let latestState = null;
    let sourceStatus = API_KEY ? "GOOGLE SATELLITE LOADING" : "OFFLINE MAP PREVIEW";
    let googleLoadTimer = null;
    const mapElement = document.getElementById("map");
    const offline = document.getElementById("offline");
    const offlineTarget = document.getElementById("targetOffline");

    function phaseClass(state) {
      if (state.destroyed) return "destroyed";
      if (state.phase === "TERMINAL_GUIDANCE") return "terminal";
      if (["DETECTION_TRANSIT", "INITIAL_GUIDANCE", "MIDCOURSE_GUIDANCE"].includes(state.phase)) return "midcourse";
      return "";
    }
    function targetLabel(state) {
      if (state.destroyed) return "SHUT DOWN";
      if (state.phase === "TERMINAL_GUIDANCE") return "TARGET / TERMINAL";
      if (state.phase === "MIDCOURSE_GUIDANCE") return "TARGET / MIDCOURSE";
      if (["DETECTION_TRANSIT", "INITIAL_GUIDANCE"].includes(state.phase)) return "TARGET / ATR ACQUIRE";
      return "";
    }
    function setTargetStyle(element, state) {
      element.className = `target-wrap ${phaseClass(state)}`;
      element.querySelector(".track-label").textContent = targetLabel(state);
      element.style.display = state.target_visible ? "block" : "none";
      const altitude = Math.max(1, Number(state.altitude_separation_m || 0));
      const coverageRadius = Math.max(1, Number(state.coverage_m || 1200) / 2);
      const maximumSlant = Math.hypot(coverageRadius, altitude);
      const slant = Math.max(
        0,
        Number(state.slant_distance_m ?? maximumSlant)
      );
      const proximity = Math.max(0, Math.min(1, 1 - slant / maximumSlant));
      const terminalGrowth = Math.pow(proximity, 2.2);
      const maximumTargetScale = Math.max(
        .65,
        document.body.clientWidth * .98 / 18
      );
      const targetScale = .65 +
        terminalGrowth * (maximumTargetScale - .65);
      const maximumBoxWidth = document.body.clientWidth;
      const maximumBoxHeight = Math.min(
        document.body.clientHeight * .92,
        11 * maximumTargetScale + 30
      );
      const boxWidth = 42 + terminalGrowth * (maximumBoxWidth - 42);
      const boxHeight = 30 + terminalGrowth * (maximumBoxHeight - 30);
      element.style.setProperty("--target-scale", String(targetScale));
      element.style.setProperty(
        "--box-scale",
        String(boxWidth / 56)
      );
      element.style.setProperty("--target-width", `${18 * targetScale}px`);
      element.style.setProperty("--target-height", `${11 * targetScale}px`);
      element.style.setProperty("--box-width", `${boxWidth}px`);
      element.style.setProperty("--box-height", `${boxHeight}px`);
    }
    function refreshHud(state) {
      document.getElementById("topLeft").textContent = state.locked ? "LOCK" : "NO LOCK";
      document.getElementById("topRight").textContent = state.seeker_mode || "ATR SEARCH";
      document.getElementById("bottomLeft").textContent = `${sourceStatus} / NOMINAL EO`;
      document.getElementById("bottomRight").textContent =
        `SLANT ${(Number(state.slant_distance_m || 0) / 1000).toFixed(2)}KM · ` +
        `H ${(Number(state.horizontal_distance_m || 0) / 1000).toFixed(2)}KM · ` +
        `ΔALT ${Number(state.altitude_separation_m || 0).toFixed(0)}M`;
    }

    function createTargetOverlay() {
      return new (class GoogleTargetOverlay extends google.maps.OverlayView {
        constructor() { super(); this.element = document.createElement("div"); this.element.innerHTML = '<div class="track-label"></div><div class="track-box"></div><div class="target-block"></div><div class="shutdown-cross">✕</div><div class="shutdown-caption">SHUT DOWN</div>'; }
        onAdd() { this.getPanes().overlayMouseTarget.appendChild(this.element); }
        draw() {
          if (!latestState || !latestState.target_visible) { this.element.style.display = "none"; return; }
          const projection = this.getProjection();
          const point = projection.fromLatLngToDivPixel(new google.maps.LatLng(latestState.target.latitude, latestState.target.longitude));
          if (!point) { this.element.style.display = "none"; return; }
          this.element.style.left = `${point.x}px`; this.element.style.top = `${point.y}px`;
          setTargetStyle(this.element, latestState);
        }
        onRemove() { this.element.remove(); }
      })();
    }

    function applyGoogleState(state) {
      if (!map) return;
      offline.style.display = "none";
      mapElement.style.display = "block";
      const center = {lat:Number(state.vehicle.latitude),lng:Number(state.vehicle.longitude)};
      const width = Math.max(240, document.body.clientWidth);
      const mpp = Number(state.coverage_m || 1200) / width;
      const zoom = Math.max(12, Math.min(20, Math.log2(156543.03392 * Math.cos(center.lat * Math.PI / 180) / mpp)));
      state.zoom = zoom;
      map.setCenter(center);
      if (Math.abs(Number(map.getZoom() || 0) - zoom) > .05) map.setZoom(zoom);
      if (targetOverlay) targetOverlay.draw();
      refreshHud(state);
    }
    function applyOfflineState(state) {
      offline.style.display = "block";
      mapElement.style.display = "none";
      const cover = Math.max(100, Number(state.coverage_m || 1200));
      const latitudeScale = 111320;
      const longitudeScale = 111320 * Math.cos(Number(state.vehicle.latitude) * Math.PI / 180);
      const east = (Number(state.target.longitude) - Number(state.vehicle.longitude)) * longitudeScale;
      const north = (Number(state.target.latitude) - Number(state.vehicle.latitude)) * latitudeScale;
      offlineTarget.style.left = `${50 + east / cover * 100}%`;
      offlineTarget.style.top = `${50 - north / cover * 100}%`;
      setTargetStyle(offlineTarget, state);
      state.zoom = 16;
      refreshHud(state);
    }
    window.updateSeeker = state => {
      latestState = state;
      if (!state || !state.vehicle || !state.target) return;
      if (map) applyGoogleState(state); else applyOfflineState(state);
    };
    function initGoogle() {
      if (googleLoadTimer) clearTimeout(googleLoadTimer);
      sourceStatus = "GOOGLE SATELLITE";
      offline.style.display = "none";
      mapElement.style.display = "block";
      map = new google.maps.Map(mapElement, {
        center:{lat:23.7438,lng:47.3281}, zoom:16, mapTypeId:"satellite",
        disableDefaultUI:true, gestureHandling:"none", keyboardShortcuts:false,
        clickableIcons:false, tilt:0, heading:0, backgroundColor:"#11150f"
      });
      targetOverlay = createTargetOverlay(); targetOverlay.setMap(map);
      if (latestState) applyGoogleState(latestState);
    }
    if (API_KEY) {
      window.initGoogle = initGoogle;
      window.gm_authFailure = () => {
        sourceStatus = "GOOGLE AUTH FAILED / OFFLINE";
        map = null;
        if (latestState) applyOfflineState(latestState);
      };
      const script = document.createElement("script");
      script.async = true; script.defer = true;
      script.src = `https://maps.googleapis.com/maps/api/js?key=${encodeURIComponent(API_KEY)}&callback=initGoogle&v=weekly`;
      script.onerror = () => {
        sourceStatus = "GOOGLE LOAD FAILED / OFFLINE";
        if (latestState) applyOfflineState(latestState);
      };
      document.head.appendChild(script);
      googleLoadTimer = setTimeout(() => {
        if (map) return;
        sourceStatus = "GOOGLE TIMEOUT / OFFLINE";
        if (latestState) applyOfflineState(latestState);
      }, 8000);
    } else {
      offline.style.display = "block";
    }
    window.seekerReady = true;
  </script>
</body>
</html>
